<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pylex SNS Growth Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:#111827;background:#f7f8fa}
input,select,textarea,button{font-family:inherit;font-size:14px}
a{text-decoration:none}

/* ── AUTH ── */
.auth-wrap{min-height:100vh;background:#0d1117;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:#111827;border:1px solid #1e2736;border-radius:14px;padding:40px;width:380px;max-width:100%}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-logo .brand{font-size:20px;font-weight:700;color:#fff}
.auth-logo .sub{font-size:11px;color:#4a5568;letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.auth-tabs{display:flex;border-bottom:1px solid #1e2736;margin-bottom:22px}
.auth-tab{flex:1;padding:9px;text-align:center;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;color:#4a5568}
.auth-tab.on{color:#4F6EF7;border-color:#4F6EF7}
.f{margin-bottom:13px}
.f label{display:block;font-size:12px;color:#4a5568;margin-bottom:4px}
.f input{width:100%;padding:10px 12px;background:#0d1117;border:1px solid #2d3748;border-radius:7px;color:#fff;outline:none;transition:border .15s}
.f input:focus{border-color:#4F6EF7}
.auth-btn{width:100%;padding:11px;background:#4F6EF7;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;margin-top:4px;transition:background .15s}
.auth-btn:hover{background:#3d5ee0}
.auth-err{font-size:12px;padding:8px 11px;background:#1a0a0a;color:#fc8181;border:1px solid #7f1d1d;border-radius:6px;margin-bottom:10px;display:none}
.auth-ok{font-size:12px;padding:8px 11px;background:#0a1a0a;color:#68d391;border:1px solid #14532d;border-radius:6px;margin-bottom:10px;display:none}

/* ── APP LAYOUT ── */
.app{display:flex;flex-direction:column;min-height:100vh}
.nav{height:52px;background:#0d1117;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #1e2736;position:sticky;top:0;z-index:100;flex-shrink:0}
.nav-l{display:flex;align-items:center;gap:10px}
.nav-brand{font-size:15px;font-weight:700;color:#fff;display:flex;align-items:center;gap:7px}
.nav-dot{width:8px;height:8px;border-radius:50%;background:#4F6EF7}
.rbadge{font-size:10px;padding:2px 9px;border-radius:20px;font-weight:600}
.rbadge.admin{background:#162032;color:#63b3ed;border:1px solid #1e3a5f}
.rbadge.staff{background:#0d2218;color:#68d391;border:1px solid #14532d}
.nav-r{display:flex;align-items:center;gap:12px}
.nav-user{font-size:12px;color:#718096}
.notif-btn{position:relative;cursor:pointer;color:#718096;display:flex;align-items:center;padding:4px}
.notif-btn svg{width:18px;height:18px}
.ndot{position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;background:#EF4444;display:none}
.lout{font-size:12px;color:#4a5568;cursor:pointer;padding:4px 10px;border:1px solid #2d3748;border-radius:5px;transition:all .15s}
.lout:hover{color:#fc8181;border-color:#fc8181}
.body{display:flex;flex:1}

/* ── SIDEBAR ── */
.sb{width:200px;background:#0d1117;border-right:1px solid #1e2736;padding:12px 8px;flex-shrink:0;display:flex;flex-direction:column;gap:2px;position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto}
.si{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px;transition:all .15s;color:#4a5568}
.si:hover{background:#1e2736;color:#a0aec0}
.si.on{background:#1a1f40;color:#4F6EF7}
.si svg{width:16px;height:16px;flex-shrink:0}
.sdiv{border-top:1px solid #1e2736;margin:6px 4px}

/* ── MAIN ── */
.main{flex:1;padding:24px;overflow:auto}
.ph{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.pt{font-size:18px;font-weight:700;color:#111827}
.ps{font-size:12px;color:#6b7280;margin-top:3px}

/* ── CARDS & GRIDS ── */
.card{background:#fff;border:1px solid #e5e7eb;border-radius:11px;padding:20px;margin-bottom:15px}
.ct{font-size:13px;font-weight:700;color:#111827;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:15px}
.kc{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:15px}
.kl{font-size:10px;color:#9ca3af;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.kv{font-size:22px;font-weight:700;color:#111827}
.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}
@media(max-width:768px){.two{grid-template-columns:1fr}.sb{width:56px}.si span{display:none}}

/* ── BADGES ── */
.badge{font-size:10px;padding:2px 8px;border-radius:12px;font-weight:600;display:inline-block}
.b-blue{background:#EEF2FF;color:#4F6EF7}
.b-green{background:#F0FDF4;color:#16A34A}
.b-amber{background:#FFFBEB;color:#D97706}
.b-red{background:#FEF2F2;color:#EF4444}
.st-active{background:#F0FDF4;color:#16A34A}
.st-pause{background:#FFFBEB;color:#D97706}
.st-end{background:#FEF2F2;color:#EF4444}

/* ── TABLE ── */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:8px 10px;color:#9ca3af;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid #e5e7eb}
.tbl td{padding:10px 10px;border-bottom:1px solid #f0f0f0;color:#374151;vertical-align:middle}
.tbl tr:hover td{background:#fafafa;cursor:default}
.tbl tr:last-child td{border-bottom:none}

/* ── FORM ── */
.fg{margin-bottom:12px}
.fg label{display:block;font-size:12px;color:#6b7280;margin-bottom:4px;font-weight:600}
.fg input,.fg select,.fg textarea{width:100%;padding:9px 11px;border:1px solid #d1d5db;border-radius:7px;color:#111827;background:#fff;outline:none;transition:border .15s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:#4F6EF7}
.fg textarea{resize:vertical;min-height:80px;line-height:1.6}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.fr{grid-template-columns:1fr}}

/* ── BUTTONS ── */
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:8px 15px;background:#fff;color:#374151;border:1px solid #d1d5db;border-radius:7px;cursor:pointer;font-size:13px;transition:all .15s}
.btn:hover{border-color:#4F6EF7;color:#4F6EF7}
.btn-p{padding:9px 18px;background:#4F6EF7;color:#fff;border:none;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;transition:background .15s}
.btn-p:hover{background:#3d5ee0}
.btn-d{padding:7px 13px;background:#fff;color:#EF4444;border:1px solid #fca5a5;border-radius:7px;cursor:pointer;font-size:12px;transition:all .15s}
.btn-d:hover{background:#FEF2F2}
.sel{padding:8px 11px;border:1px solid #e5e7eb;border-radius:7px;background:#fff;color:#111827;cursor:pointer;outline:none}

/* ── MESSAGES ── */
.smsg{font-size:12px;padding:8px 11px;border-radius:6px;margin-top:10px;display:none}
.smsg.ok{background:#f0fdf4;color:#16A34A;border:1px solid #bbf7d0}
.smsg.err{background:#fef2f2;color:#EF4444;border:1px solid #fecaca}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:48px 20px;color:#9ca3af}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty p{font-size:14px;margin-bottom:14px}

/* ── NOTIFICATIONS ── */
.ni{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid #f0f0f0}
.ni:last-child{border-bottom:none}

/* ── REPORT ── */
.rp-hdr{background:#0d1117;border-radius:11px;padding:28px;margin-bottom:15px;color:#fff}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:14px;padding:28px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto}
.modal-t{font-size:16px;font-weight:700;margin-bottom:20px;color:#111827}

/* ── AI BOX ── */
.ai-box{background:#EEF2FF;border:1px solid #c7d2fe;border-radius:9px;padding:15px;margin-bottom:12px}
.ai-label{font-size:12px;font-weight:700;color:#4F6EF7;margin-bottom:7px}

/* ── IDEA GRID ── */
.idea-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:9px}
.idea-item{background:#f8f9fb;border:1px solid #e5e7eb;border-radius:8px;padding:12px;font-size:13px;color:#374151;display:flex;align-items:center;gap:8px}

/* ── API CARD ── */
.api-card{border:1px solid #e5e7eb;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.api-icon{font-size:22px}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-wrap" class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="brand">Pylex SNS Growth</div>
      <div class="sub">Social Media Analytics</div>
    </div>
    <div class="auth-tabs">
      <div class="auth-tab on" id="tab-login" onclick="showTab('login')">ログイン</div>
      <div class="auth-tab" id="tab-reg" onclick="showTab('reg')">新規登録</div>
    </div>
    <div class="auth-err" id="auth-err"></div>
    <div class="auth-ok" id="auth-ok"></div>

    <div id="login-form">
      <div class="f"><label>メールアドレス</label><input id="l-email" type="email" placeholder="email@example.com" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <div class="f"><label>パスワード</label><input id="l-pass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <button class="auth-btn" onclick="doLogin()">ログイン</button>
    </div>

    <div id="reg-form" style="display:none">
      <div class="f"><label>名前</label><input id="r-name" placeholder="山田 太郎"></div>
      <div class="f"><label>メールアドレス</label><input id="r-email" type="email" placeholder="email@example.com"></div>
      <div class="f"><label>パスワード（6文字以上）</label><input id="r-pass" type="password" placeholder="••••••••"></div>
      <div class="f"><label>招待コード</label><input id="r-code" placeholder="管理者から受け取ったコードを入力"></div>
      <button class="auth-btn" onclick="doReg()">アカウントを作成</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app-wrap" class="app" style="display:none">
  <div class="nav">
    <div class="nav-l">
      <div class="nav-brand"><div class="nav-dot"></div>Pylex SNS Growth</div>
      <div class="rbadge" id="role-badge"></div>
    </div>
    <div class="nav-r">
      <div class="notif-btn" onclick="go('notifs')" title="通知">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6 6 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
        <div class="ndot" id="ndot"></div>
      </div>
      <div class="nav-user" id="nav-user"></div>
      <div class="lout" onclick="doLogout()">ログアウト</div>
    </div>
  </div>
  <div class="body">
    <div class="sb" id="sidebar"></div>
    <div class="main" id="main"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-body"></div>
</div>

<script>
// ── ICONS (SVG strings) ──
const ICONS={
  dashboard:'<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>',
  building:'<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 21h18M9 21V5a2 2 0 012-2h2a2 2 0 012 2v16M9 7h6M9 11h6M9 15h6"/></svg>',
  edit:'<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>',
  bulb:'<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9.663 17h4.673M12 3v1M6.343 6.343l-.707.707M3 12H2M6.343 17.657l-.707-.707M21 12h-1M17.657 6.343l-.707.707M17.657 17.657l-.707-.707M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>',
  report:'<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 17v-2m3 2v-4m3 4v-6M3 20h18a1 1 0 001-1V5a1 1 0 00-1-1H3a1 1 0 00-1 1v14a1 1 0 001 1z"/></svg>',
  bell:'<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6 6 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>',
  users:'<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>',
  api:'<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>',
};

// ── CONSTANTS ──
const MONTHS=['2026-07','2026-08','2026-09','2026-10','2026-11','2026-12'];
const STLABEL={active:'運用中',pause:'一時停止',end:'契約終了'};
const IND=['美容室・サロン','飲食店','工務店・建設','不動産','アパレル・EC','ジム・フィットネス','車・バイク','医療・クリニック','教育・スクール','その他'];
const IDEAS={
  '美容室・サロン':['Before→Afterカット動画','スタイリスト密着','ヘアケア術3選','季節のカラートレンド','自宅スタイリング術','お客様インタビュー'],
  '飲食店':['新メニュー調理工程','シェフのこだわり食材','人気ランキング','開店準備の裏側','賄い飯紹介','季節限定メニュー発表'],
  '工務店・建設':['施工前後のBefore→After','職人の技術密着','現場ドキュメント','タイムラプス動画','よくある施工ミス3選','採用向け職場紹介'],
  '不動産':['物件紹介ウォークスルー','内見のポイント解説','エリア紹介・周辺環境','リノベーション事例','相場・市況解説','購入体験談'],
  'アパレル・EC':['新作コーディネート紹介','スタッフ着用ルーポク','素材・こだわり紹介','梱包・発送の裏側','セール告知動画','お客様レビュー紹介'],
  'ジム・フィットネス':['自宅トレーニング紹介','Before→After体験談','正しいフォームのコツ','よくある筋トレミス3選','トレーナー密着','会員インタビュー'],
  '車・バイク':['車両紹介インプレッション','納車の流れ','中古車選びの注意点','人気車ランキング','カスタム事例紹介','メンテナンスのコツ'],
  '医療・クリニック':['先生インタビュー','施術の流れ','よくある質問Q&A','院内紹介ツアー','スタッフ紹介','症例Before→After'],
  '教育・スクール':['授業風景ダイジェスト','卒業生の声','先生密着','合格体験談','学習方法のコツ','施設紹介ツアー'],
  'その他':['スタッフ紹介動画','お客様の声','サービス紹介','よくある質問Q&A','代表メッセージ','仕事の裏側'],
};

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function fm(m){const[y,mo]=m.split('-');return`${y}年${parseInt(mo)}月`}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function n2s(n){return n?Number(n).toLocaleString():'-'}

// ── DB (localStorage) ──
const ADMIN={id:'admin_001',email:'hiro@pylexgroup.com',password:'pylex2025',role:'admin',name:'HIRO（管理者）',createdAt:'2026-01-01'};
const DEFAULT_INVITE_CODE='pylex-staff-2026';
let DB={users:[ADMIN],clients:{},kpi:{},notifs:[]};
let ME=null, PAGE='dashboard', SEL_C=null, SEL_M='2026-07';

function save(){
  try{localStorage.setItem('pylex_db',JSON.stringify(DB));}catch(e){}
}
function load(){
  try{
    const s=localStorage.getItem('pylex_db');
    if(s){
      const d=JSON.parse(s);
      // Merge staff users (keep admin hardcoded)
      if(d.users)d.users.filter(u=>u.role==='staff').forEach(u=>{if(!DB.users.find(x=>x.id===u.id))DB.users.push(u);});
      if(d.clients)DB.clients=d.clients;
      if(d.kpi)DB.kpi=d.kpi;
      if(d.notifs)DB.notifs=d.notifs;
    }
  }catch(e){}
}
function loadSession(){
  try{const id=localStorage.getItem('pylex_ses');if(id){const u=DB.users.find(x=>x.id===id);if(u)return u;}
  }catch(e){}return null;
}
function myClients(){return DB.clients[ME.id]||[]}
function setMyClients(a){DB.clients[ME.id]=a;save()}
function getKPI(uid,cid,m){return DB.kpi[`${uid}:${cid}:${m}`]||null}
function setKPI(uid,cid,m,d){DB.kpi[`${uid}:${cid}:${m}`]=d;save()}

// ── AUTH ──
function showTab(t){
  document.getElementById('tab-login').classList.toggle('on',t==='login');
  document.getElementById('tab-reg').classList.toggle('on',t==='reg');
  document.getElementById('login-form').style.display=t==='login'?'block':'none';
  document.getElementById('reg-form').style.display=t==='reg'?'block':'none';
  clearAuthMsg();
}
function clearAuthMsg(){
  document.getElementById('auth-err').style.display='none';
  document.getElementById('auth-ok').style.display='none';
}
function authErr(m){const e=document.getElementById('auth-err');e.textContent=m;e.style.display='block';document.getElementById('auth-ok').style.display='none';}
function authOk(m){const e=document.getElementById('auth-ok');e.textContent=m;e.style.display='block';document.getElementById('auth-err').style.display='none';}

function doLogin(){
  const email=document.getElementById('l-email').value.trim().toLowerCase();
  const pass=document.getElementById('l-pass').value;
  if(!email||!pass){authErr('メールアドレスとパスワードを入力してください');return;}
  const u=DB.users.find(x=>x.email.toLowerCase()===email&&x.password===pass);
  if(!u){authErr('メールアドレスまたはパスワードが正しくありません');return;}
  ME=u;
  try{localStorage.setItem('pylex_ses',u.id);}catch(e){}
  showApp();
}
function doReg(){
  const name=document.getElementById('r-name').value.trim();
  const email=document.getElementById('r-email').value.trim().toLowerCase();
  const pass=document.getElementById('r-pass').value;
  const code=document.getElementById('r-code').value.trim();
  if(!name){authErr('名前を入力してください');return;}
  if(!email||!email.includes('@')){authErr('正しいメールアドレスを入力してください');return;}
  if(pass.length<6){authErr('パスワードは6文字以上で設定してください');return;}
  const savedCode=localStorage.getItem('pylex_invite_code')||DEFAULT_INVITE_CODE;
  if(code!==savedCode){authErr('招待コードが正しくありません。管理者に確認してください。');return;}
  if(DB.users.find(u=>u.email.toLowerCase()===email)){authErr('このメールアドレスは既に登録されています');return;}
  DB.users.push({id:uid(),email,password:pass,role:'staff',name,createdAt:new Date().toISOString()});
  save();
  authOk('登録完了！ログインしてください。');
  setTimeout(()=>showTab('login'),1500);
}

// ── APP INIT ──
function showApp(){
  document.getElementById('auth-wrap').style.display='none';

  document.getElementById('role-badge').textContent=ME.role==='admin'?'管理者':'スタッフ';

// ── ROUTING ──
function go(p){PAGE=p;render();}
function render(){
  renderSB();
  checkNotifs();
  const el=document.getElementById('main');
  el.innerHTML=getPage();
  // Restore API key if on that page
  if(PAGE==='apikeys'){
    try{const k=localStorage.getItem('pylex_api');if(k&&document.getElementById('api-key'))document.getElementById('api-key').value=k;}catch(e){}
  }
}

function renderSB(){
  const isA=ME.role==='admin';
  const items=[
    {id:'dashboard',icon:ICONS.dashboard,label:'ダッシュボード'},
    {id:'clients',icon:ICONS.building,label:'クライアント'},
    {id:'input',icon:ICONS.edit,label:'データ入力'},
    {id:'suggest',icon:ICONS.bulb,label:'コンテンツ提案'},
    {id:'report',icon:ICONS.report,label:'月次レポート'},
    {id:'notifs',icon:ICONS.bell,label:'通知'},
    ...(isA?[{divider:true},{id:'admin',icon:ICONS.users,label:'スタッフ管理'}]:[]),
    {id:'apikeys',icon:ICONS.api,label:'設定'},
  ];
  document.getElementById('sidebar').innerHTML=items.map(i=>
    i.divider?'<div class="sdiv"></div>':
    `<div class="si ${PAGE===i.id?'on':''}" onclick="go('${i.id}')">${i.icon}<span>${i.label}</span></div>`
  ).join('');
}

function checkNotifs(){
  const u=DB.notifs.filter(n=>n.to===ME.id&&!n.read).length;
  document.getElementById('ndot').style.display=u?'block':'none';
}

// ── PAGES ──
function getPage(){
  if(PAGE==='dashboard')return pDash();
  if(PAGE==='clients')return pClients();
  if(PAGE==='input')return pInput();
  if(PAGE==='suggest')return pSuggest();
  if(PAGE==='report')return pReport();
  if(PAGE==='notifs')return pNotifs();
  if(PAGE==='admin'&&ME.role==='admin')return pAdmin();
  if(PAGE==='apikeys')return pAPI();
  return pDash();
}

function saveKpi(cid){
  const g=id=>{const el=document.getElementById(id);return el?el.value:'';};
  setKPI(ME.id,cid,SEL_M,{
    posts:+g('i-posts')||0,views:+g('i-views')||0,follower:+g('i-fol')||0,
    likes:+g('i-likes')||0,comments:+g('i-com')||0,saves:+g('i-saves')||0,
    profile:+g('i-prof')||0,shares:+g('i-shares')||0,memo:g('i-memo'),
    ts:new Date().toISOString()
  });
  const ok=document.getElementById('input-ok');
  if(ok){ok.textContent='保存しました！';ok.style.display='block';setTimeout(()=>{ok.style.display='none';},2000);}
}

function exportCSV(cid,cname){
  const rows=[['月','投稿数','総再生数','フォロワー増加','いいね','コメント','保存','プロフアクセス','シェア','メモ']];
  MONTHS.forEach(m=>{const d=getKPI(ME.id,cid,m);if(d)rows.push([m,d.posts,d.views,d.follower,d.likes,d.comments,d.saves,d.profile,d.shares,d.memo||'']);});
  const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download=cname+'_SNSレポート.csv';a.click();
}

    <div class="smsg ok" id="invite-ok"></div>

  </div>`:''}
  <div class="card"><div class="ct">SNS API連携 <span class="badge b-amber">準備中</span></div>
  <div class="card"><div class="ct">SNS API連携 <span class="badge b-amber">準備中</span></div>
    <p style="font-size:13px;color:#6b7280;margin-bottom:18px;line-height:1.8">Instagram・TikTok・YouTubeのAPIと連携することでKPI数値を自動取得できるようになります。現在は手動入力での運用となります。</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px">
      ${[['📸','Instagram Graph API'],['🎵','TikTok Business API'],['▶️','YouTube Data API v3']].map(([icon,name])=>`
      <div class="api-card"><div class="api-icon">${icon}</div><div style="font-size:13px;font-weight:600">${name}</div><span class="badge b-amber">準備中</span></div>`).join('')}
    </div>
  </div>
  <div class="card"><div class="ct">Claude API <span class="badge b-blue">設定可能</span></div>
    <p style="font-size:13px;color:#6b7280;margin-bottom:15px">APIキーを設定するとAI分析・コンテンツ提案機能が強化されます。</p>
    <div class="fg"><label>APIキー</label><input id="api-key" type="password" placeholder="sk-ant-..."></div>
    <div class="smsg ok" id="api-ok"></div>
    <button class="btn-p" style="width:auto" onclick="saveAPI()">保存</button>
  </div>`;
}
function saveAPI(){
  const k=document.getElementById('api-key').value;
  try{localStorage.setItem('pylex_api',k);}catch(e){}
  const ok=document.getElementById('api-ok');ok.textContent='APIキーを保存しました';ok.style.display='block';
  setTimeout(()=>ok.style.display='none',2000);
}
function saveInviteCode(){
  const code=document.getElementById('invite-code').value.trim();
  if(!code){alert('招待コードを入力してください');return;}
  localStorage.setItem('pylex_invite_code',code);
  const ok=document.getElementById('invite-ok');ok.textContent='招待コードを変更しました！社員に新しいコードを共有してください。';ok.style.display='block';
  setTimeout(()=>{ok.style.display='none';render();},2500);
}

// ── MODALS ──
function openModal(html){
  document.getElementById('modal-body').innerHTML=html;
  document.getElementById('modal-bg').classList.add('show');
}
function closeModal(){document.getElementById('modal-bg').classList.remove('show');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

function openClientModal(id){
  const c=id?myClients().find(x=>x.id===id):null;
  openModal(`<div class="modal-t">${c?'クライアント編集':'クライアント追加'}</div>
    <div class="fg"><label>クライアント名 *</label><input id="m-name" value="${esc(c?c.name:'')}"></div>
    <div class="fg"><label>業種</label><select id="m-ind">${IND.map(i=>`<option ${c&&c.industry===i?'selected':''}>${esc(i)}</option>`).join('')}</select></div>
    <div class="fg"><label>ステータス</label><select id="m-st">
      <option value="active" ${!c||c.status==='active'?'selected':''}>運用中</option>
      <option value="pause" ${c&&c.status==='pause'?'selected':''}>一時停止</option>
      <option value="end" ${c&&c.status==='end'?'selected':''}>契約終了</option>
    </select></div>
    <div class="fg"><label>メモ</label><textarea id="m-memo">${esc(c?c.memo||'':'')}</textarea></div>
    <div class="smsg err" id="m-err"></div>
    <div class="acts">
      <button class="btn-p" style="flex:1" onclick="saveClient('${esc(id||'')}')">${c?'更新':'追加'}</button>
      <button class="btn" onclick="closeModal()">キャンセル</button>
    </div>`);
}
function saveClient(id){
  const n=(document.getElementById('m-name')||{value:''}).value.trim();
  if(!n){const e=document.getElementById('m-err');if(e){e.textContent='クライアント名を入力してください';e.style.display='block';}return;}
  const cs=myClients();
  const data={name:n,industry:(document.getElementById('m-ind')||{value:IND[0]}).value,status:(document.getElementById('m-st')||{value:'active'}).value,memo:(document.getElementById('m-memo')||{value:''}).value};
  if(id){const i=cs.findIndex(c=>c.id===id);if(i>-1)cs[i]={...cs[i],...data};}
  else cs.push({id:uid(),createdAt:new Date().toISOString(),...data});
  setMyClients(cs);closeModal();render();
}
function delClient(id){
  if(!confirm('このクライアントを削除しますか？関連するデータも全て削除されます。'))return;
  setMyClients(myClients().filter(c=>c.id!==id));
  Object.keys(DB.kpi).filter(k=>k.includes(':'+id+':')).forEach(k=>delete DB.kpi[k]);
  save();if(SEL_C===id)SEL_C=null;render();
}

function openNotifModal(){
  const staff=DB.users.filter(u=>u.role==='staff');
  openModal(`<div class="modal-t">スタッフへメッセージ送信</div>
    <div class="fg"><label>送信先</label><select id="n-to">
      <option value="all">全スタッフ</option>
      ${staff.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}
    </select></div>
    <div class="fg"><label>メッセージ</label><textarea id="n-msg" placeholder="フィードバックや連絡事項を入力..."></textarea></div>
    <div class="smsg err" id="n-err"></div>
    <div class="acts">
      <button class="btn-p" style="flex:1" onclick="sendNotif()">送信</button>
      <button class="btn" onclick="closeModal()">キャンセル</button>
    </div>`);
}
function sendNotif(){
  const msg=(document.getElementById('n-msg')||{value:''}).value.trim();
  if(!msg){const e=document.getElementById('n-err');if(e){e.textContent='メッセージを入力してください';e.style.display='block';}return;}
  const to=(document.getElementById('n-to')||{value:'all'}).value;
  const targets=to==='all'?DB.users.filter(u=>u.role==='staff'):[DB.users.find(u=>u.id===to)].filter(Boolean);
  targets.forEach(u=>DB.notifs.push({id:uid(),from:ME.id,to:u.id,msg,read:false,ts:new Date().toISOString()}));
  save();closeModal();render();
}

function openStaffDetail(staffId){
  const u=DB.users.find(x=>x.id===staffId);
  const cs=DB.clients[staffId]||[];
  openModal(`<div class="modal-t">${esc(u?.name)} の担当データ</div>
    ${!cs.length?`<p style="color:#9ca3af;font-size:13px;padding:12px 0">クライアントがまだいません</p>`:
    `<table class="tbl"><thead><tr><th>クライアント</th><th>業種</th><th>状態</th><th>累計再生数</th></tr></thead><tbody>
    ${cs.map(c=>{
      const tv=MONTHS.reduce((a,m)=>{const d=getKPI(staffId,c.id,m);return a+(d?Number(d.views||0):0);},0);
      return`<tr><td><strong>${esc(c.name)}</strong></td><td style="color:#6b7280">${esc(c.industry||'-')}</td>
      <td><span class="badge st-${c.status}">${STLABEL[c.status]}</span></td><td>${tv.toLocaleString()}</td></tr>`;
    }).join('')}
    </tbody></table>`}
    <div style="margin-top:18px"><button class="btn" onclick="closeModal()">閉じる</button></div>`);
}

// ── BOOT ──
load();
const ses=loadSession();
if(ses){ME=ses;document.getElementById('auth-wrap').style.display='none';showApp();}
</script>
